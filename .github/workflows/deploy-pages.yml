# Publish main to the production site https://njs50.github.io/scoreme/.
# Pages serves branch gh-pages (folder /). Each run rebuilds the site and
# force-pushes the output there, so gh-pages only holds the latest build.
#
# Switch Settings → Pages → Source to "Deploy from a branch: gh-pages / (root)"
# only after the first successful run here has created that branch.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production base is /scoreme (vite.config.ts). The committed docs/ folder is
      # cleared first so hashed assets from older builds are not republished.
      - name: Build site
        env:
          PUBLIC_BUILD_ID: ${{ github.sha }}
        run: |
          rm -rf docs
          pnpm run build

      - name: Publish docs to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch docs/.nojekyll
          cd docs
          git init
          git checkout -B gh-pages
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "Pushed production build ${GITHUB_SHA}"
